version: '3.8'

services:
  bot:
    build: .
    container_name: selene-bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./warnings.json:/app/warnings.json
      - ./trusted_framework_users.json:/app/trusted_framework_users.json
      - ./execution_redline_bypass_users.json:/app/execution_redline_bypass_users.json
    networks:
      - selene-network

  redis:
    image: redis:7
    container_name: selene-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - selene-network

networks:
  selene-network:
    driver: bridge
